{{ define "main" }}
  {{ partial "crumbs.html" . }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{ if eq .Section "posts" }}
    {{ range .Pages }}
      <article class="post">
        <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
        <p class="small"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time></p>
        {{ .Summary }}
      </article>
    {{ end }}
  {{ end }}
{{ end }}
